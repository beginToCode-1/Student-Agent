<!DOCTYPE html>
<html>
<head>
    <title>Study Agent</title>
</head>
<body>
    <h2>Study Agent Planner</h2>

    <form method="post">
        <label>Subject name</label><br>
        <input type="text" name="subject" required><br><br>

        <button type="submit">Show Plan</button>
    </form>

    {% if output %}
        <h3>Study Plan</h3>
        <pre>{{ output }}</pre>
    {% endif %}
</body>
</html>
